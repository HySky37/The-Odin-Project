<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Lists</h1>
    <h2>Unordered Lists </h2>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li></li>
    </ul>
    <p> hierfür nutzen wir das ul tag und li für jedes listen item</p>

    <h2>Ordered List</h2>
    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>
    <p> hierfür nutzen wir das ol tag und li für jedes listen item</p>

    



</body>
</html>
